[graph]
all-features = false
no-default-features = false
exclude-unpublished = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  { id = "RUSTSEC-2026-0009", reason = "`time` is only used by rcgen a dev-only dependency" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip-tree = [
    { crate = "windows-sys@0.52", reason = "a foundational crate for many that bumps far too frequently to ever have a shared version" },
    { crate = "getrandom@0.2", reason = "ring depends on an older version of the getrandom crate" },
    { crate = "syn@2", reason = "syn 2 is used by some crates that have not updated yet" },
    { crate = "syn@3", reason = "syn 3 is used by some crates that have updated already" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
